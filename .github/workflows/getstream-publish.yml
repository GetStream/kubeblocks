name: Publish KubeBlocks (GetStream fork)

# Publishes the forked operator IMAGE and CHART to GHCR at one version, so the
# two never drift. Run with the org-namespaced baseline tag (e.g.
# 1.0.2-getstream.1); image tag == chart version, and chat's rocky installer
# pins both by it.
#
# Manual (workflow_dispatch) by design. Existing serial.* artifacts are left
# untouched; this publishes new tags only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'GetStream baseline version (image tag == chart version), e.g. 1.0.2-getstream.1'
        required: true
        default: '1.0.2-getstream.1'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # arm64 emulation; the make target's install-docker-buildx creates the
      # multi-arch builder.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image (linux/amd64,linux/arm64)
        run: make push-manager-image IMG=ghcr.io/getstream/kubeblocks VERSION=${{ inputs.version }} BUILDX_ENABLED=true

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The chart's crds/ are no longer .helmignored, so the fork CRDs travel
      # with the chart.
      - name: Package and push chart
        run: |
          helm package deploy/helm --version "${{ inputs.version }}" --app-version "${{ inputs.version }}"
          helm push "kubeblocks-${{ inputs.version }}.tgz" oci://ghcr.io/getstream/charts
